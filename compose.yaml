services:
  secure-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secure-app:v1.0
    container_name: secure-app-hardened
    ports:
      - "13000:3000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
